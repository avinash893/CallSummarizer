name: Render 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to keep Render service warm 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -s -f https://callsummarizer.onrender.com/health || exit 0
